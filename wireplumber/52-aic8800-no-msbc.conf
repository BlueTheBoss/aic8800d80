# AIC8800 combo Bluetooth: force CVSD for the headset (HFP/HSP) profile.
#
# The AIC8800D80 family (a69c:8d81 and relatives) desyncs its mSBC stream
# over USB isochronous SCO: the kernel logs "SCO packet for unknown
# connection handle" and bursts of "corrupted SCO packet", microphone
# capture returns nothing, and the resulting profile-switch churn disturbs
# A2DP playback. Negotiating CVSD instead is reliable on this controller.
#
# Installed system-wide by install.sh when WirePlumber is present. Remove
# this file to regain mSBC wideband calls if a future chip firmware fixes
# the SCO path. A2DP music quality is unaffected.
monitor.bluez.properties = {
  bluez5.enable-msbc = false
  bluez5.codecs = [ ldac aptx_hd aptx sbc_xq aac sbc cvsd ]
}
